name: "🐛 Bug Report"
description: "Report a bug or output parsing error in CUPP"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form to help us diagnose the profile generation issue.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear description of what the issue is."
      placeholder: "e.g., Tool fails to run on Python 3.12 due to outdated modules..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction Steps"
      description: "How can we reproduce the error?"
      placeholder: |
        1. Run `python cupp.py -i`...
        2. Input parameters...
        3. See error output...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs and Console Output"
      render: shell
